<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="742" viewBox="0 0 1280 742" role="img" aria-labelledby="title desc">
  <title id="title">Three draft layouts for the Template Editor Find Asset ribbon</title>
  <desc id="desc">Option A stacks a field selector, search box and Find button in a separate group. Option B places field selector, search box and Find button in one row. Option C uses a ribbon button to open a search pane with results.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill:#e9e9e9; }
      .h { font-size:24px; font-weight:600; }
      .k { font-size:16px; font-weight:600; fill:#77c7f3; }
      .small { font-size:14px; fill:#aeb5bb; }
      .label { font-size:15px; fill:#d9dde0; }
      .group { font-size:14px; fill:#cbd0d3; }
      .input { fill:#262626; stroke:#858b90; stroke-width:1.5; }
      .ribbon { fill:#292929; stroke:#4b4b4b; stroke-width:1.5; }
      .muted { fill:#acb3b8; }
    </style>
  </defs>
  <rect width="1280" height="742" fill="#1e1e1e"/>
  <text x="30" y="43" class="h">Find Asset — ribbon layout drafts</text>
  <text x="30" y="68" class="small">Schematic options for ArcGIS Pro; each places search across the group divider from Templates.</text>

  <text x="30" y="112" class="k">A  Clear stacked controls</text>
  <text x="30" y="133" class="small">Recommended for the current ribbon: familiar layout, visible action and hint.</text>
  <rect x="30" y="150" width="1220" height="155" rx="8" class="ribbon"/>
  <rect x="47" y="168" width="68" height="68" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="81" y="211" text-anchor="middle" class="label">O</text>
  <text x="81" y="260" text-anchor="middle" class="label">Open</text>
  <rect x="130" y="168" width="68" height="68" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="164" y="211" text-anchor="middle" class="label">R</text>
  <text x="164" y="260" text-anchor="middle" class="label">Reload</text>
  <rect x="213" y="168" width="68" height="68" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="247" y="211" text-anchor="middle" class="label">S</text>
  <text x="247" y="260" text-anchor="middle" class="label">Settings</text>
  <text x="164" y="293" text-anchor="middle" class="group">Templates</text>
  <path d="M320 165V294" stroke="#666"/>
  <text x="340" y="178" class="small">Search by</text>
  <rect x="340" y="187" width="256" height="35" rx="4" class="input"/>
  <text x="353" y="211" class="label">Facility ID</text><text x="576" y="211" class="label">⌄</text>
  <rect x="340" y="229" width="256" height="35" rx="4" class="input"/>
  <text x="353" y="252" class="small">Enter exact ID</text>
  <rect x="606" y="229" width="96" height="35" rx="4" fill="#2e729e"/>
  <text x="654" y="252" text-anchor="middle" class="label">Find</text>
  <text x="522" y="293" text-anchor="middle" class="group">Find Asset</text>

  <text x="30" y="352" class="k">B  Compact query row</text>
  <text x="30" y="373" class="small">Faster to scan; takes more horizontal ribbon space and may collapse sooner.</text>
  <rect x="30" y="390" width="1220" height="140" rx="8" class="ribbon"/>
  <rect x="47" y="408" width="68" height="68" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="81" y="451" text-anchor="middle" class="label">O</text>
  <text x="81" y="500" text-anchor="middle" class="label">Open</text>
  <rect x="130" y="408" width="68" height="68" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="164" y="451" text-anchor="middle" class="label">R</text>
  <text x="164" y="500" text-anchor="middle" class="label">Reload</text>
  <rect x="213" y="408" width="68" height="68" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="247" y="451" text-anchor="middle" class="label">S</text>
  <text x="247" y="500" text-anchor="middle" class="label">Settings</text>
  <text x="164" y="520" text-anchor="middle" class="group">Templates</text>
  <path d="M320 405V519" stroke="#666"/>
  <text x="340" y="416" class="small">Search by</text>
  <rect x="340" y="431" width="184" height="40" rx="4" class="input"/>
  <text x="353" y="457" class="label">Facility ID</text><text x="504" y="457" class="label">⌄</text>
  <rect x="534" y="431" width="260" height="40" rx="4" class="input"/>
  <text x="547" y="457" class="small">Enter exact ID</text>
  <rect x="804" y="431" width="96" height="40" rx="4" fill="#2e729e"/>
  <text x="852" y="457" text-anchor="middle" class="label">Find</text>
  <text x="620" y="520" text-anchor="middle" class="group">Find Asset</text>

  <text x="30" y="577" class="k">C  Search command + results pane</text>
  <text x="30" y="598" class="small">Best for reviewing multiple matches and non-spatial rows; adds a pane and more implementation work.</text>
  <rect x="30" y="614" width="1220" height="113" rx="8" class="ribbon"/>
  <rect x="47" y="629" width="68" height="60" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="81" y="667" text-anchor="middle" class="label">O</text>
  <rect x="130" y="629" width="68" height="60" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="164" y="667" text-anchor="middle" class="label">R</text>
  <rect x="213" y="629" width="68" height="60" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="247" y="667" text-anchor="middle" class="label">S</text>
  <text x="164" y="715" text-anchor="middle" class="group">Templates</text>
  <path d="M320 625V716" stroke="#666"/>
  <rect x="340" y="629" width="110" height="60" rx="5" fill="#3a3a3a" stroke="#707070"/>
  <text x="395" y="653" text-anchor="middle" font-size="24">⌕</text>
  <text x="395" y="678" text-anchor="middle" class="label">Find Asset</text>
  <text x="395" y="715" text-anchor="middle" class="group">Find Asset</text>
  <path d="M475 670H506" stroke="#9eabb3" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#9eabb3" stroke-width="1.5"/></marker></defs>
  <rect x="522" y="625" width="386" height="91" rx="4" fill="#343434" stroke="#777"/>
  <text x="540" y="650" class="label">Find Asset</text>
  <text x="540" y="674" class="small">Facility ID  ⌄     Enter exact ID     Find</text>
  <path d="M540 684H890" stroke="#666"/>
  <text x="540" y="704" class="small">Results: ElectricDevice (3) · StructureObject (1)</text>
</svg>
